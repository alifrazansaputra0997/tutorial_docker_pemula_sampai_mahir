# Membuat urutan untuk mnenjalankan containernya tidak bersamaan
# check logs untuk melihat apakah service pernah direstart
# untuk melihat secara realtime bisa pakai docker events
# docker events --filter "container=nama_container"
services:
  mongodb-example3:
    image: mongo:latest
    container_name: mongodb-example3
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: alif
      MONGO_INITDB_ROOT_PASSWORD: alif
      MONGO_INITDB_DATABASE: admin
    networks:
      - network_example
    
  mongodb-express-example:
    image: mongo-express:latest
    container_name: mongodb-express-example
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: alif
      ME_CONFIG_MONGODB_ADMINPASSWORD: alif
      ME_CONFIG_MONGODB_SERVER: mongodb-example
    networks:
      - network_example
    depends_on:
      - mongodb-example3

networks:
  network_example:
    name: network_example
    driver: bridge